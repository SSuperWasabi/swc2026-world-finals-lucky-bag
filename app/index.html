<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<!-- 화면 폭을 무대 크기(2048)로 고정한다. iPad Pro 12.9형에서는 무대가 줄임 없이 실제 화소 크기로 그려져,
     Safari가 층마다 4배 크기 그림을 잡지 않는다(v28까지: 2048 무대를 절반으로 줄여 보여 줘 메모리 초과로 앱이 꺼졌다). -->
<meta name="viewport" content="width=2048, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWC Lucky Bag">
<meta name="theme-color" content="#160A33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>SWC Lucky Bag</title>
<style>
  @font-face{font-family:Unb;src:url(assets/fonts/Unbounded-Variable.ttf) format("truetype");font-weight:200 900;font-display:block}
  @font-face{font-family:Pre;src:url(assets/fonts/Pretendard-Bold.otf);font-weight:700;font-display:block}
  @font-face{font-family:Seed;src:url(assets/fonts/LINESeedSans-Bold.otf);font-weight:700;font-display:block}
  :root{--A:#ff4fa3;--B:#a46bff;--C:#ffc443;--ink:#4b0fb8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d0620;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  #stage{position:absolute;left:0;top:0;width:2048px;height:2732px;transform-origin:0 0;overflow:hidden;font-family:Pre,system-ui,sans-serif;color:#fff}
  /* ── 공통 liquid glass ── */
  .glass{position:relative;border-radius:64px;
    background:linear-gradient(150deg,rgba(255,255,255,.26) 0%,rgba(255,255,255,.10) 38%,rgba(190,150,255,.08) 100%);
    -webkit-backdrop-filter:blur(36px) saturate(170%);backdrop-filter:blur(36px) saturate(170%);
    border:2px solid rgba(255,255,255,.38);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -3px 10px rgba(255,255,255,.12),inset 0 0 60px rgba(255,255,255,.06),0 40px 100px rgba(25,0,70,.45)}
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(120% 60% at 20% -10%,rgba(255,255,255,.35),transparent 55%),radial-gradient(80% 50% at 110% 120%,rgba(210,170,255,.22),transparent 60%)}
  .glass.dark{background:linear-gradient(150deg,rgba(40,10,90,.55),rgba(20,5,55,.62));border-color:rgba(255,255,255,.28)}
  /* ── 배경 (OAP 019-1 기반, AE 렌더 영상이 오면 #bgVideo로 대체) ── */
  .bg{position:absolute;inset:0;overflow:hidden}
  .bgbase{position:absolute;inset:0;background:radial-gradient(1400px 1100px at 62% 62%,#9b45ff 0%,#7a1fef 38%,transparent 70%),linear-gradient(200deg,#3a0089 0%,#5b0fc7 30%,#7a17ea 60%,#6a0fe0 100%)}
  .streaks{position:absolute;inset:-8%;background:url(assets/lb/bg-streaks.jpg) center 62%/cover no-repeat;opacity:.45;will-change:transform}
  .streaks.s1{animation:drift1 22s ease-in-out infinite alternate}
  .streaks.s2{opacity:.28;mix-blend-mode:screen;transform:scaleX(-1);animation:drift2 17s ease-in-out infinite alternate}
  @keyframes drift1{from{transform:translate3d(-2%,1%,0) scale(1.02)}to{transform:translate3d(2%,-2%,0) scale(1.1)}}
  @keyframes drift2{from{transform:scaleX(-1) translate3d(-3%,-1%,0) scale(1.05)}to{transform:scaleX(-1) translate3d(3%,2%,0) scale(1.12)}}
  .beams{position:absolute;inset:-20%;opacity:.5;mix-blend-mode:screen;will-change:transform;
    background:repeating-linear-gradient(118deg,transparent 0 220px,rgba(255,255,255,.07) 260px,rgba(230,200,255,.16) 290px,transparent 340px 560px);
    animation:beams 14s linear infinite}
  @keyframes beams{from{transform:translate3d(-12%,0,0)}to{transform:translate3d(12%,0,0)}}
  #bgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  #bgVideo.ready{display:block}
  #bgVideo.ready ~ .beams,#bgVideo.ready ~ .streaks{display:none}
  #sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .panel{position:absolute;inset:0;background:linear-gradient(135deg,#e9e3fb 0%,#f6f5f9 55%,#fafafa 100%);clip-path:polygon(0 0,975px 0,0 975px)}
  .panel2{position:absolute;inset:0;background:linear-gradient(160deg,#e6d6fb,#d9c3fa);clip-path:polygon(0 485px,245px 730px,0 975px)}
  /* 엠블럼 + 글리치 (OAP처럼 2~3초마다 짧게 튐) */
  .emblem-wrap{position:absolute;left:44px;top:44px;width:600px}
  .emblem-wrap img{display:block;width:100%}
  .emblem-wrap .gl{position:absolute;inset:0;opacity:0}
  .emblem-wrap .g1{filter:hue-rotate(-40deg) saturate(3);animation:glitch1 2.8s steps(1) infinite}
  .emblem-wrap .g2{filter:hue-rotate(120deg) saturate(3);animation:glitch2 2.8s steps(1) infinite}
  .emblem-wrap .base{animation:glitch0 2.8s steps(1) infinite}
  @keyframes glitch0{0%,88%,100%{transform:none}90%{transform:translateX(-8px)}93%{transform:translateX(6px) skewX(-4deg)}96%{transform:none}}
  @keyframes glitch1{0%,88%,100%{opacity:0}89%{opacity:.85;transform:translate(14px,-4px);clip-path:inset(18% 0 52% 0)}92%{opacity:.7;transform:translate(-18px,3px);clip-path:inset(60% 0 12% 0)}95%{opacity:0}}
  @keyframes glitch2{0%,89%,100%{opacity:0}90%{opacity:.8;transform:translate(-12px,5px);clip-path:inset(40% 0 30% 0)}94%{opacity:.6;transform:translate(16px,-2px);clip-path:inset(8% 0 70% 0)}97%{opacity:0}}
  .store{position:absolute;right:72px;top:78px;height:96px}
  .title{position:absolute;right:72px;top:640px;font-family:Unb;font-weight:850;font-size:150px;text-align:right;line-height:.94;letter-spacing:-.01em;text-shadow:0 6px 30px #3a008955}
  .title span{display:block}
  #stage.notitle .title{display:none}
  /* 대기 화면에 들어올 때마다: 타이틀이 오른쪽에서 닦이듯 등장 */
  #stage.intro .title span{animation:wipeIn .75s cubic-bezier(.2,.8,.2,1) both}
  #stage.intro .title span+span{animation-delay:.12s}
  #stage.intro .store{animation:fadeDown .6s .3s ease-out both}
  @keyframes wipeIn{from{clip-path:inset(0 0 0 100%);transform:translateX(80px)}to{clip-path:inset(0 0 0 0);transform:none}}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
  /* 대기 카드: OAP 방패 순서(가운데 → 왼쪽 → 오른쪽)로 떠오르고, 둥실 떠 있음 */
  #idleCards .slot{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
  #idleCards .s-m{animation-delay:.1s}#idleCards .s-l{animation-delay:.5s}#idleCards .s-r{animation-delay:.7s}
  @keyframes rise{from{opacity:0;transform:translateY(90px) scale(.92)}to{opacity:1;transform:none}}
  #idleCards .card{animation:bob 3.4s ease-in-out infinite alternate}
  #idleCards .s-l .card{animation-delay:-1.1s}#idleCards .s-r .card{animation-delay:-2.2s}
  @keyframes bob{from{transform:translateY(0) rotateZ(-.6deg)}to{transform:translateY(-34px) rotateZ(.6deg)}}
  #idleCards .ring{animation:breathe 3.4s ease-in-out infinite alternate}
  @keyframes breathe{from{opacity:.55;transform:translateX(-50%) scaleX(.92)}to{opacity:1;transform:translateX(-50%) scaleX(1.06)}}
  /* 뒷면 광택: 카드 모양으로만 비치게 마스크 */
  /* 빛 띠는 작은 조각(1/4 크기)을 4배로 늘려 '위치 이동'으로만 움직인다 → 매 프레임 다시 그리지 않음(iPad 부하) */
  .back .shine{position:absolute;top:0;left:-1.9%;width:103.8%;height:100%;pointer-events:none;overflow:hidden;border-radius:calc(var(--cw)*.0895)}
  .back .shine::before{content:"";position:absolute;left:0;top:0;width:75%;height:25%;transform-origin:0 0;transform:translateX(-320%) scale(4);
    background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.0) 40%,rgba(255,255,255,.55) 48%,rgba(255,240,255,.15) 54%,transparent 62%) no-repeat;
    animation:shine 4.2s ease-in-out infinite}
  .s-l .back .shine::before{animation-delay:1.4s}.s-r .back .shine::before{animation-delay:2.8s}
  @keyframes shine{0%,55%{transform:translateX(-320%) scale(4)}85%,100%{transform:translateX(53.33%) scale(4)}}
  .startpill{position:absolute;left:50%;top:2380px;transform:translateX(-50%);padding:34px 90px;border-radius:999px;font-family:Unb;font-weight:700;font-size:60px;letter-spacing:.08em;white-space:nowrap}
  .startpill{animation:pillPulse 2.2s ease-in-out infinite}
  @keyframes pillPulse{0%,100%{box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 0 0 0 rgba(220,190,255,.0),0 40px 100px rgba(25,0,70,.45)}50%{box-shadow:inset 0 3px 0 rgba(255,255,255,.55),0 0 0 24px rgba(220,190,255,.16),0 40px 100px rgba(25,0,70,.45)}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  /* 1번 메인: 영상이 화면 전체(로고·타이틀·캐릭터 포함)를 그린다 → 공통 배경·로고는 숨김 */
  .mainvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;visibility:hidden}
  .mainvid.on{visibility:visible}
  #stage.vidbg .bg,#stage.vidbg .panel,#stage.vidbg .panel2,#stage.vidbg .emblem-wrap,#stage.vidbg .store,#stage.vidbg .title{display:none}
  #scr-idle,#scr-staff,#scr-draw{background:#5b1fd0}
  /* 첫 화면 아래 가운데 앱 버전(기존 럭키드로우 앱과 같은 자리·크기·색) */
  #idleVer{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;
    font-family:system-ui,-apple-system,sans-serif;font-weight:500;font-size:26px;color:#ffffffb3}
  /* ── 3번 선택 화면: OAP 18_Result Bo5 패널 ── */
  :root{--rb-ink:#2b0b6e;--rb-line:#3d1490;--rb-vio:#7a2ff0;--rb-blue:#3b7bff}
  .rb-panel{position:absolute;left:104px;right:102px;top:830px;bottom:285px;padding:64px 70px;display:flex;flex-direction:column;
    background:linear-gradient(160deg,rgba(255,255,255,.97) 0%,rgba(247,242,255,.95) 55%,rgba(226,233,255,.93) 100%);
    border:3px solid #fff;box-shadow:0 40px 120px rgba(30,0,80,.35);overflow:hidden}
  .rb-panel::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(45deg,transparent 46%,rgba(150,110,255,.10) 50%,transparent 54%),linear-gradient(-45deg,transparent 46%,rgba(150,110,255,.10) 50%,transparent 54%)}
  .rb-panel>*{position:relative}
  .rb-title{font-family:Pre;font-size:84px;color:var(--rb-ink);margin:0 0 34px}
  #chips{display:none!important}
  .rb-qty{height:210px;margin:0 -70px 60px;display:flex;align-items:center;justify-content:center;gap:120px}
  .rb-qbar{position:absolute;inset:0;background:linear-gradient(90deg,rgba(170,120,255,0) 0%,rgba(170,120,255,.5) 26%,var(--rb-vio) 50%,rgba(110,160,255,.5) 74%,rgba(110,160,255,0) 100%);transform-origin:50% 50%}
  .rb-qty button{position:relative;width:220px;height:210px;border:0;background:none;font-family:Unb;font-weight:800;font-size:150px;line-height:1}
  #qMinus{color:var(--rb-vio)}#qPlus{color:var(--rb-blue)}
  .rb-qty .n{position:relative;font-family:Unb;font-weight:800;font-size:230px;color:#fff;min-width:420px;text-align:center;text-shadow:0 0 40px rgba(255,255,255,.65),0 6px 24px rgba(60,0,140,.35)}
  .rb-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:26px;margin-bottom:60px}
  .rb-keys button{height:150px;background:#fff;border:5px solid var(--rb-line);color:var(--rb-ink);font-family:Unb;font-weight:700;font-size:70px}
  .rb-keys button.on{background:linear-gradient(180deg,#f3ebff,#cdb5ff);border-color:var(--rb-vio);box-shadow:0 0 0 6px rgba(122,47,240,.22)}
  .rb-stock{display:flex;gap:30px;margin-bottom:36px}
  .rb-stock div{flex:1;padding:34px 10px 30px;text-align:center;border:5px solid var(--acc);background:linear-gradient(135deg,#fff 0%,#f4edff 60%,#e4eaff 100%);color:var(--rb-ink);font-size:46px;font-weight:700;transform-origin:0 50%}
  .rb-stock b{display:block;font-family:Unb;font-weight:800;font-size:140px;line-height:1.05}
  .rb-warn{min-height:64px;font-size:48px;color:#d1004f;text-align:center;margin-bottom:16px;font-weight:700}
  .rb-btns{display:flex;gap:30px;margin-top:auto}
  .rb-btns button{height:250px;border:5px solid var(--rb-line);color:var(--rb-ink);font-family:Pre;font-weight:700}
  .rb-cancel{width:320px;background:rgba(255,255,255,.75);font-size:72px}
  .rb-start{flex:1;background:linear-gradient(90deg,#f4edff 0%,#dac8ff 55%,#bfd4ff 100%);font-size:104px}
  .rb-start:disabled{opacity:.4}
  /* 들어올 때(Result Bo5 타이밍): 판 → 제목 → 숫자 띠가 가운데서 펼쳐짐 → 키가 줄마다 좌·우에서 차례로 → 재고 막대 → 버튼 */
  #scr-staff.enter .rb-panel{animation:rbFade .35s ease-out both}
  #scr-staff.enter .rb-title{animation:rbFromL .9s .1s cubic-bezier(.2,.8,.2,1) both}
  #scr-staff.enter .rb-qbar{animation:rbScaleX .87s .05s cubic-bezier(.2,.8,.2,1) both}
  #scr-staff.enter .rb-qty .n{animation:rbPop .8s .23s cubic-bezier(.2,.8,.2,1) both}
  #scr-staff.enter .rb-qty button{animation:rbFade .6s .45s ease-out both}
  #scr-staff.enter .rb-keys button{animation:rbFromL 1.1s cubic-bezier(.2,.8,.2,1) both}
  #scr-staff.enter .rb-keys button:nth-child(n+6){animation-name:rbFromR}
  #scr-staff.enter .rb-keys button:nth-child(5n+1){animation-delay:.10s}#scr-staff.enter .rb-keys button:nth-child(5n+2){animation-delay:.27s}
  #scr-staff.enter .rb-keys button:nth-child(5n+3){animation-delay:.37s}#scr-staff.enter .rb-keys button:nth-child(5n+4){animation-delay:.50s}
  #scr-staff.enter .rb-keys button:nth-child(5n){animation-delay:.63s}
  #scr-staff.enter .rb-stock div{animation:rbScaleX .93s cubic-bezier(.2,.8,.2,1) both}
  #scr-staff.enter .rb-stock div:nth-child(1){animation-delay:.55s}#scr-staff.enter .rb-stock div:nth-child(2){animation-delay:.72s}#scr-staff.enter .rb-stock div:nth-child(3){animation-delay:.82s}
  #scr-staff.enter .rb-btns{animation:rbFromB .8s .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes rbFade{from{opacity:0}to{opacity:1}}
  @keyframes rbFromL{from{opacity:0;transform:translateX(-160px)}to{opacity:1;transform:none}}
  @keyframes rbFromR{from{opacity:0;transform:translateX(160px)}to{opacity:1;transform:none}}
  @keyframes rbFromB{from{opacity:0;transform:translateY(80px)}to{opacity:1;transform:none}}
  @keyframes rbScaleX{from{transform:scaleX(0);opacity:.2}to{transform:none;opacity:1}}
  @keyframes rbPop{from{opacity:0;transform:scale(1.35)}to{opacity:1;transform:none}}
  /* 화면 전환 영상(기존 럭키드로우 앱 그대로): 매트는 곱하기, 색은 더하기로 합성 */
  .screen-transition-layer{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;pointer-events:none;visibility:hidden;z-index:4000}
  .screen-transition-layer.is-active{visibility:visible}
  .screen-transition-layer.is-matte{mix-blend-mode:multiply}
  .screen-transition-layer.is-colour{z-index:4001;mix-blend-mode:screen}
  @supports (mix-blend-mode:plus-lighter){.screen-transition-layer.is-colour{mix-blend-mode:plus-lighter}}
  #transition-shield{position:fixed;inset:0;z-index:4002;display:none}
  #transition-shield.is-active{display:block}
  #tapzone{position:absolute;right:0;top:0;width:300px;height:260px;z-index:50}
  /* 화면 */
  .scr{position:absolute;inset:0;display:none}
  .scr.on{display:block}
  /* 카드 */
  .slot{position:absolute;width:560px;height:840px;perspective:2400px;--cw:560px;--acc:#c9a2ff}
  /* 4번 화면 세로 배치: 스토어 로고 104~167(우상단) · 타이틀 430~685(공개 후 405~755) · 카드 930~1860 · 바닥 소환진 ~2090 · 버튼 2135~2285 · 당첨 수량 2335~2575 */
  /* 가로 간격(iPad Pro 12.9형: 1mm ≈ 9.5px). 3장: 카드 사이 60px(약 6mm, 전보다 4mm 넓힘) / 2장: 가운데로 모아 사이 140px */
  .s-l{left:124px;top:1020px}.s-m{left:744px;top:930px}.s-r{left:1364px;top:1020px}
  .s-2l{left:394px;top:975px}.s-2r{left:1094px;top:975px}
  .s-solo{left:714px;top:915px;width:620px;height:930px;--cw:620px}
  /* 바닥 소환진: 카드 아래로 조금 띄워(카드가 그 위에 떠서 도는 연출) 어둡고 희미하게 — 주인공은 카드.
     원판 높이 = 카드 폭의 0.364배, 카드 밑에서 0.045배(약 25px) 띄움 */
  .ring{position:absolute;left:50%;bottom:calc(var(--cw)*-.409);width:100%;aspect-ratio:2.75;transform:translateX(-50%);pointer-events:none;
    background:url(assets/lb/pedestal.webp) center/100% 100% no-repeat;opacity:.5;filter:brightness(.62) saturate(.75);transition:opacity .5s ease,filter .5s ease}
  /* 떠 있는 카드가 원판 위에 드리우는 그림자 + 은은한 빛 */
  .ring::before{content:"";position:absolute;left:22%;right:22%;top:20%;bottom:34%;border-radius:50%;background:radial-gradient(closest-side,rgba(8,0,24,.7),transparent 75%)}
  .ring::after{content:"";position:absolute;left:20%;right:20%;top:10%;bottom:30%;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,220,170,.45),rgba(190,120,255,.25) 55%,transparent 78%);opacity:.5;animation:pedBreath 3.4s ease-in-out infinite}
  @keyframes pedBreath{50%{opacity:.2}}
  .slot.revealing .ring{opacity:.8;filter:brightness(1) saturate(1)}
  .slot.revealing .ring::after{opacity:1;animation-duration:.9s}
  /* 옆 카드가 가운데 받침대보다 앞에 오도록(받침대 끝이 옆 카드 모서리를 덮지 않게) */
  .s-l,.s-r,.s-2l,.s-2r{z-index:2}.s-m{z-index:1}
  .card{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform}
  .face{position:absolute;inset:0;border-radius:6%}
  .face img.frameimg{position:absolute;top:0;left:-1.9%;width:103.8%;height:100%;max-width:none}  /* 새 뒷면은 가로가 3.8% 넓은 비율 → 가운데 맞춤(변형 없이 위치로만) */
  /* 카드 둘레 빛: 흐림 필터(drop-shadow) 대신 카드 뒤에 깔린 그림자 한 장으로 그린다.
     필터는 카드 안 영상·광택이 움직일 때마다 다시 계산돼 iPad에서 뒤집기가 멈출 만큼 무거웠다(11-10 실기기). */
  /* 번짐은 원래 흐릿해서, 1/4 크기 조각을 4배로 늘려도 같아 보인다. 큰 흐림 그림자를 처음 그리는 비용은 1/16로 준다
     (카드가 등장할 때 이 그림자들을 처음 그리느라 화면이 멈췄다). 아래 수치는 모두 '보이는 크기의 1/4'이다. */
  .back::before,.front::before,.back .pulse{content:"";position:absolute;left:37.25%;top:37.75%;width:25.5%;height:24.5%;transform:scale(4);will-change:transform;
    border-radius:calc(var(--cw)*.015);pointer-events:none}

<script>
'use strict';
const APP_VER = 'swc-lb-v34'; /* sw.js CACHE와 함께 올림 */
const $ = (id) => document.getElementById(id);
$('idleVer').textContent = APP_VER;
const stage = $('stage');
/* ── 진단: 화면이 멈춘 순간과 화면 흐름을 기록한다(관리자 → 백업 맨 아래에서 본다) ──
   iPad에서만 생기는 끊김은 PC에서 재현되지 않아, 기기가 스스로 '언제 얼마나 멈췄는지'를 남기게 했다.
   화면을 그릴 차례가 60ms(약 4프레임) 넘게 밀리면 '멈춤'으로 적는다. 최근 80줄만 남긴다. */
const diag = [];
function mark(label) { diag.push([performance.now(), label]); if (diag.length > 80) diag.shift(); }
window.mark = mark;   // reveal.js에서도 쓴다
(function watchStalls() {
  let last = performance.now();
  const tick = (now) => { const dt = now - last; last = now; if (dt > 60 && dt < 5000 && !document.hidden) mark(`멈춤 ${Math.round(dt)}ms`); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  document.addEventListener('visibilitychange', () => { last = performance.now(); });
})();
// 저장소 접근이 막힌 설정(사이트 데이터 차단 등)이어도 앱은 뜨게 하고 직원에게 알린다.
let storageBlocked = false;
const storage = (() => {
  try { const s = window.localStorage; s.getItem('probe'); return s; }
  catch (e) { storageBlocked = true; const m = new Map(); return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; }
})();
const store = BagStore.createStore(storage);
const TYPES = BagEngine.TYPES;
let busy = false;

/* 화면이 바뀐 직후 같은 자리를 한 번 더 누른 탭이 새 화면 버튼을 누르지 않게 잠깐 무시한다. */
let guardUntil = 0;
function guard(ms = 450) { guardUntil = performance.now() + ms; }
stage.addEventListener('click', (e) => { if (performance.now() < guardUntil) { e.stopPropagation(); e.preventDefault(); } }, true);

/* 연출은 언제 바뀔지 모르는 부분이라, 오류를 내거나 끝나지 않아도 정해진 시간 안에 앱이 다시 움직이게 한다. */
function runAnim(fn, maxMs) {
  return Promise.race([Promise.resolve().then(fn).catch((e) => console.error('연출 오류', e)), new Promise((r) => setTimeout(r, maxMs))]);
}
function ensureShown(slot, type) {
  // 연출이 시간 안에 안 끝났어도(느린 기기) 카드를 정상 앞면 상태로 확정
  if (slot.classList.contains('flipped') && !slot.classList.contains('revealing')) return;
  try { Reveal.show(slot, type); } catch (e) { slot.classList.add('flipped'); }
}

/* ── 무대 맞춤 ── */
/* iPad는 같은 화면인데도 높이를 두 가지(상태 막대 24pt 차이)로 번갈아 알려 주는 때가 있다.
   v29는 그때마다 무대 크기를 다시 맞춰서 첫 화면이 매 프레임 1.7%씩 커졌다 작아졌다 했다(11-11 실기기 녹화).
   → 폭이 그대로이고 배율이 3% 안에서 '커지는' 변화는 무시하고 작은 쪽에 머문다. 회전·창 크기 변경처럼 큰 변화만 다시 맞춘다. */
let fitS = 0, fitW = 0;
function fit() {
  const w = innerWidth, h = innerHeight;
  if (!w || !h) return;
  const s = Math.min(w / 2048, h / 2732);
  if (fitS && Math.abs(w - fitW) < fitW * 0.03 && s >= fitS && s < fitS * 1.03) return;
  fitS = s; fitW = w;
  stage.style.transform = `translate(${(w - 2048 * s) / 2}px,${(h - 2732 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();
// iPad는 처음 뜰 때·회전 직후 화면 크기를 늦게 알려 주는 일이 있어 한 번 더 맞춘다
addEventListener('orientationchange', () => setTimeout(fit, 300));
setTimeout(fit, 400);

/* ── 영상은 지금 화면에 필요한 것만 메모리에 올린다 ──
   iPad는 올려 둔 영상마다 해독기와 화면 몇 장 분량의 메모리를 잡는다. v28까지는 모든 화면의 영상을 한꺼번에 올려 둬 메모리 한도를 넘겼다.
   화면에 들어올 때 그 화면 영상을 올리고, 나갈 때 내린다. 3번(수량 선택)에서는 바로 다음인 4번 영상까지 미리 올려 둔다. */
const SCREEN_VIDEOS = { 'scr-idle': ['mvIntro', 'mvLoop'], 'scr-staff': ['selLoop', 'drawLoop', 'drawEmblem'], 'scr-draw': ['drawLoop', 'drawEmblem'], 'scr-admin': [] };
const ALL_VIDEOS = ['mvIntro', 'mvLoop', 'selLoop', 'drawLoop', 'drawEmblem'];
function loadVideo(v) { if (v && !v.getAttribute('src')) { v.src = v.dataset.src; v.load(); } }
function unloadVideo(v) { if (!v) return; try { v.pause(); if (v.getAttribute('src')) { v.removeAttribute('src'); v.load(); } } catch (e) { } }
function useVideos(id) { const need = SCREEN_VIDEOS[id] || []; ALL_VIDEOS.forEach((n) => (need.includes(n) ? loadVideo($(n)) : unloadVideo($(n)))); }
function prepVideos(id) { (SCREEN_VIDEOS[id] || []).forEach((n) => loadVideo($(n))); }   // 다음 화면 영상을 전환이 시작될 때 미리 올림
/* 카드 앞면 영상: 요소를 지우기만 하면 iPad가 해독기를 한동안 붙잡고 있어서, 지우기 전에 직접 내려 준다 */
function freeVideos(root) { root.querySelectorAll('video').forEach(unloadVideo); }

/* ── 공통 ── */
/* 금가루: 화면마다 26알, 위치·크기·속도 제각각 */
document.querySelectorAll('.dust').forEach((d) => {
  for (let i = 0; i < 26; i++) {
    const e = document.createElement('i'), r = Math.random;
    e.style.cssText = `--x:${(r() * 100).toFixed(1)}%;--y:${(45 + r() * 60).toFixed(1)}%;--s:${(7 + r() * 13).toFixed(0)}px;--d:${(7 + r() * 7).toFixed(1)}s;--t:-${(r() * 14).toFixed(1)}s;--dx:${((r() - 0.5) * 220).toFixed(0)}px`;
    d.appendChild(e);
  }
});
function go(id) {
  guard(); mark('화면 ' + id.replace('scr-', ''));
  if (id !== 'scr-draw') { $('scr-draw').classList.remove('spot'); freeVideos($('slots')); }
  // 1번·3번은 AE 영상이 배경·로고·타이틀을 그린다 → 공통 배경 숨김
  stage.classList.toggle('vidbg', id === 'scr-idle' || id === 'scr-staff' || id === 'scr-draw');
  if (id !== 'scr-idle' && typeof stopMain === 'function') stopMain();
  useVideos(id);   // 이 화면 영상만 올리고 나머지는 내린다
  if (id === 'scr-staff') $('selLoop').play().catch(() => {});
  ['drawLoop', 'drawEmblem'].forEach((v) => { const dl = $(v); if (id === 'scr-draw') dl.play().catch(() => {}); else dl.pause(); });
  document.querySelectorAll('.scr').forEach((s) => s.classList.toggle('on', s.id === id));
  stage.classList.toggle('notitle', id === 'scr-admin');
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function ask(text, yesLabel = '예', noLabel = '아니요') {
  return new Promise((res) => {
    guard();
    $('mText').textContent = text; $('mYes').textContent = yesLabel;
    $('mNo').textContent = noLabel || ''; $('mNo').style.display = noLabel ? '' : 'none';
    $('modal').classList.add('on');
    const done = (v) => { $('modal').classList.remove('on'); $('mYes').onclick = $('mNo').onclick = null; res(v); };
    $('mYes').onclick = () => done(true); $('mNo').onclick = () => done(false);
  });
}
function counts(list) { const c = { A: 0, B: 0, C: 0 }; list.forEach((t) => c[t]++); return c; }
const sumText = (c) => `A ${c.A} · B ${c.B} · C ${c.C}`;
/* 4번 화면 타이틀: 평소 LUCKY BAG DRAW, 구매 전체 공개가 끝나면 CONGRATS! GREAT LOOT! (살짝 사라졌다 바뀜) */
let drawTitleDone = null;
function setDrawTitle(done) {
  if (drawTitleDone === done) return; drawTitleDone = done;
  const el = $('dTitle'), html = done ? 'CONGRATS!<br>GREAT LOOT!' : 'COM2US STORE<br>LUCKY BAG DRAW';
  el.classList.add('swap');
  setTimeout(() => { el.innerHTML = html; el.classList.toggle('big', done); el.classList.remove('swap'); }, 350);
}
/* 하단 당첨 수량: 방패+알파벳 엠블럼(OAP grade 에셋, 흰색) 옆에 수량. 그림은 한 번만 만들고 숫자만 바꾼다 */
function renderSum(c) {
  const el = $('dSum');
  if (!el.dataset.built) { el.innerHTML = ['A', 'B', 'C'].map((t) => `<span class="gsum"><img src="assets/lb/grade-${t}.png" alt="${t}"><b data-t="${t}"></b></span>`).join(''); el.dataset.built = '1'; }
  el.querySelectorAll('b').forEach((b) => { b.textContent = c[b.dataset.t]; });
  el.setAttribute('aria-label', sumText(c));
}
function slotHTML(cls) {
  return `<div class="slot ${cls}"><div class="ring"></div><i class="pillar"></i><div class="card"><i class="cglow"></i>` +
    `<div class="face back"><i class="pulse"></i><img class="frameimg" src="assets/lb/card-back.png" alt=""><div class="shine"></div></div>` +
    `<div class="face front"></div><div class="flash"></div></div></div>`;
}
const POS = { 1: ['s-m'], 2: ['s-2l', 's-2r'], 3: ['s-l', 's-m', 's-r'] };

/* ── 대기 ── */
/* ── 화면 전환 영상: 화면이 완전히 가려진 순간 화면을 바꾸고, 걷힐 때 다음 화면 모션을 시작 ── */
const screenTransition = new ScreenTransition($('transition-matte'), $('transition-colour'), $('transition-shield'));
screenTransition.onMark = (label) => mark(label);   // 전환이 끝날 때 정리에 걸린 시간을 진단 기록에 남긴다
if (screenTransition.available) screenTransition.warm();
function withTransition(fn) { if (!document.hidden) { mark('전환 시작'); screenTransition.run(fn); screenTransition.afterReveal(() => mark('전환 걷히기 시작')); } else fn(); }
/* 전환 영상이 완전히 끝나고(끝날 때 하는 정리 작업 포함) 화면이 다시 안정적으로 그려지기 시작한 뒤에 cb를 부른다.
   전환이 걷히는 도중·끝나는 순간에는 iPad의 화면 처리가 바빠서, 그때 시작한 움직임은 앞부분이 잘려 보였다(11-11 실기기: 카드 등장). */
function whenSettled(cb) {
  const t0 = performance.now(); let waited = false, marked = false, calm = 0, last = 0;
  const poll = (now) => {
    const over = performance.now() - t0 > 3000;   // 무슨 일이 있어도 3초 안에는 진행
    if (screenTransition.busy && !over) { waited = true; calm = 0; last = now; return requestAnimationFrame(poll); }
    if (waited && !marked) { marked = true; mark('전환 끝'); }
    // 화면이 3번 연속 제때(40ms 안) 그려질 때까지 기다린다 — 정리 작업으로 멈춰 있는 동안에는 시작하지 않는다
    if (last && now - last < 40) calm++; else calm = 0;
    last = now;
    if (calm >= 3 || over) return cb();
    requestAnimationFrame(poll);
  };
  requestAnimationFrame(poll);
}

/* ── 1번 메인 대기 화면: AE(OAP 06_Match Up 가공) 영상. 들어올 때 인트로 1번 → 10초 루프 반복 ── */
const mvIntro = $('mvIntro'), mvLoop = $('mvLoop');
function playMain() {
  mvLoop.pause(); mvLoop.classList.remove('on');
  try { mvIntro.currentTime = 0; } catch (e) { }
  mvIntro.classList.add('on');
  mvIntro.play().catch(() => startLoop());
}

/* ── 배경 반짝이 입자 (가볍게: 1024×1366 캔버스, 초당 30프레임) ── */
(function sparks() {
  const cv = $('sparks'), cx = cv.getContext('2d');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const P = Array.from({ length: 46 }, () => ({ x: Math.random() * 1024, y: Math.random() * 1366, r: 1 + Math.random() * 2.6, v: 0.15 + Math.random() * 0.5, a: Math.random() * Math.PI * 2, gold: Math.random() < 0.35 }));
  let last = 0;
  function tick(t) {
    requestAnimationFrame(tick);
    if (stage.classList.contains('vidbg')) return;   // 영상 배경 화면(1·3·4번)에서는 이 반짝이가 안 보이므로 그리지 않는다
    if (t - last < 33) return; last = t;
    cx.clearRect(0, 0, 1024, 1366);
    for (const p of P) {
      p.y -= p.v; p.a += 0.03; if (p.y < -10) { p.y = 1376; p.x = Math.random() * 1024; }
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(p.a));
      cx.fillStyle = p.gold ? `rgba(255,214,140,${tw})` : `rgba(255,255,255,${tw * 0.8})`;
      cx.shadowColor = cx.fillStyle; cx.shadowBlur = 8;
      cx.beginPath(); cx.arc(p.x + Math.sin(p.a) * 6, p.y, p.r, 0, Math.PI * 2); cx.fill();
    }
  }
  requestAnimationFrame(tick);
})();

/* ── 뽑기 ── */
function batchInfo(c) {
  const start = c.batches.slice(0, c.batchIndex).reduce((a, b) => a + b, 0);
  const n = c.batches[c.batchIndex];
  return { start, n, types: c.results.slice(start, start + n) };
}
/* 카드 목록: 반드시 .slot만 센다(다른 요소가 섞여도 순번이 밀리지 않게) */
const slotEls = () => [...$('slots').children].filter((el) => el.classList.contains('slot'));
function renderDraw(fresh) {
  const c = store.state.current;
  if (!c) return showIdle();
  if (c.done) return completePurchase(); // [지급 완료] 직후 새로 고침된 경우
  const { n, types } = batchInfo(c);
  const solo = c.settings.unit === 'single';
  const cls = solo ? ['s-solo'] : POS[n];
  pending = []; runId++;
  freeVideos($('slots'));   // 앞 묶음 카드 영상을 내린 뒤 새 카드로 바꾼다
  $('slots').innerHTML = cls.map(slotHTML).join('');
  const slots = slotEls();
  slots.forEach((s, i) => {
    if (c.revealed.includes(i)) Reveal.show(s, types[i]);
    s.addEventListener('click', () => tapCard(i));
  });
  $('dBar').innerHTML = ''; $('dBar').dataset.html = '';
  go('scr-draw');
  if (fresh || c.revealed.length === 0) {
    // 카드 등장은 전환 영상이 '완전히 끝난 뒤' 시작한다(whenSettled). 그동안 카드는 1% 투명도로 놓아 둔다(.preenter):
    // 눈에는 안 보이지만 카드 그림·빛 번짐이 미리 그려져서, 등장 동작이 시작될 때 처음 그리느라 멈추지 않는다.
    busy = true; updateDraw();
    slots.forEach((s) => s.classList.add('preenter'));
    whenSettled(() => {
      mark('카드 등장 시작');
      runAnim(() => Reveal.enter(slots), 3000).then(() => { slots.forEach((s) => s.classList.remove('preenter', 'entering')); mark('카드 등장 끝'); busy = false; updateDraw(); });
    });
  } else { busy = false; updateDraw(); }
}
function revealedSoFar(c) {
  const { start, types } = batchInfo(c);
  return [...c.results.slice(0, start), ...c.revealed.map((i) => types[i])];
}
/* 뒤집는 중인 카드: 저장은 이미 '공개'지만, 연출이 끝날 때까지 아래 합계에 넣지 않는다(결과 미리 노출 방지) */
const animating = new Set();
function updateDraw() {
  const c = store.state.current; if (!c) return;
  const { n } = batchInfo(c);
  const solo = c.settings.unit === 'single';
  const allMode = !solo && c.settings.reveal === 'all';
  const doneBatch = c.revealed.length >= n;
  const slots = slotEls();
  slots.forEach((s, i) => s.classList.toggle('tappable', !busy && !allMode && !c.revealed.includes(i)));
  const shown = revealedSoFar(c).slice(0, revealedSoFar(c).length - c.revealed.filter((i) => animating.has(i)).length);
  renderSum(counts(shown));
  setDrawTitle(doneBatch && c.batchIndex === c.batches.length - 1 && !busy);
  $('dSub').textContent = solo ? `${shown.length} / ${c.qty}` : `BATCH ${c.batchIndex + 1} / ${c.batches.length} · ${shown.length} OF ${c.qty}`;
  $('dSub').hidden = solo ? c.qty <= 1 : c.batches.length <= 1;   // 한 번에 끝나는 구매면 진행 문구 불필요
  const last = c.batchIndex === c.batches.length - 1;
  let bar = '';
  if (!doneBatch) {
    $('dHint').textContent = busy || allMode ? '' : solo ? 'TAP THE CARD' : n > 1 ? 'TAP A CARD TO REVEAL' : 'TAP THE CARD';
    if (allMode && !busy) bar = `<button class="btn pri" id="dOpen">TAP TO OPEN</button>`;
  } else if (c.settings.resultConfirm === false) {
    // 결과 확인 끄기: 버튼 없이 화면 탭 또는 7초 뒤 자동으로 다음(묶음/메인)
    $('dHint').textContent = busy ? '' : 'TAP TO CONTINUE';
    if (!busy) armAuto();
  } else {
    $('dHint').textContent = '';
    if (!busy) bar = last ? `<button class="btn pri" id="dNext">지급 완료</button>` : `<button class="btn pri" id="dNext">${solo ? '다음 뽑기 ▶' : '다음 묶음 ▶'}</button>`;
  }
  $('dHint').classList.toggle('blink', !!$('dHint').textContent);
  if ($('dBar').dataset.html !== bar) {
    $('dBar').innerHTML = bar; $('dBar').dataset.html = bar;
    if ($('dOpen')) $('dOpen').onclick = openAll;
    if ($('dNext')) $('dNext').onclick = nextStep;
  }
}
/* 뒤집는 중인 카드 목록(순서대로). 다시 누르면 맨 앞 카드부터 바로 완료한다 */
let pending = [], flipStartAt = 0, runId = 0;
const flipDone = (p) => p.slot.classList.contains('flipped') && !p.slot.classList.contains('revealing');
function endRun(id) {
  if (id !== runId) return; runId++; mark('뒤집기 끝');
  pending.splice(0).forEach((p) => { ensureShown(p.slot, p.type); animating.delete(p.i); });
  busy = false; updateDraw();
}
function skipNext() {
  while (pending.length && flipDone(pending[0])) animating.delete(pending.shift().i);   // 이미 끝난 카드는 건너뜀
  const p = pending.shift(); if (!p) return endRun(runId);
  Reveal.finish(p.slot, p.type); animating.delete(p.i);
  if (pending.every(flipDone)) endRun(runId); else updateDraw();
}
function startRun(items, maxMs, play) {
  mark(`뒤집기 시작(${items.length}장)`);
  pending = items; flipStartAt = performance.now();
  const id = ++runId;
  runAnim(play, maxMs).then(() => endRun(id));
}
function tapCard(i) {
  const c = store.state.current;
  if (!c) return;
  // 한 장씩 공개: 뒤집는 중에 아직 안 연 '다른 카드'를 누르면 → 진행 중인 카드를 바로 완료하고 누른 카드를 곧바로 시작
  if (busy && pending.length && !c.revealed.includes(i) && performance.now() - flipStartAt > 180) { while (busy && pending.length) skipNext(); }
  if (busy || c.revealed.includes(i)) return;
  if (c.settings.unit !== 'single' && c.settings.reveal === 'all') return openAll();   // 카드를 눌러도 TAP TO OPEN과 같다
  const { types } = batchInfo(c);
  busy = true;
  try { store.markRevealed(i); } catch (e) { busy = false; toast(e.message); return; }
  animating.add(i);
  updateDraw();
  const slot = slotEls()[i];
  startRun([{ i, slot, type: types[i] }], 5500, () => Reveal.flip(slot, types[i]));
}
function openAll() {
  const c = store.state.current;
  if (busy || !c) return;
  const { types } = batchInfo(c);
  const todo = types.map((_, i) => i).filter((i) => !c.revealed.includes(i));
  busy = true;
  try { todo.forEach((i) => store.markRevealed(i)); } catch (e) { busy = false; toast(e.message); return; }
  todo.forEach((i) => animating.add(i));
  updateDraw();
  const slots = slotEls();
  startRun(todo.map((i) => ({ i, slot: slots[i], type: types[i] })), 7000,
    () => Promise.all(todo.map((i, n) => Reveal.flip(slots[i], types[i], { delay: n * 520 }))));
}
/* 결과 확인 끄기일 때: 다 열린 뒤 7초 자동 넘김, 1초 지난 뒤부터 화면 탭으로도 넘김 */
const AUTO_MS = 7000, TAP_DELAY_MS = 1000;
let autoTimer = null, autoArmedAt = 0;
function armAuto() {
  if (autoTimer) return;
  autoArmedAt = performance.now();
  autoTimer = setTimeout(() => { autoTimer = null; if ($('scr-draw').classList.contains('on')) nextStep(); }, AUTO_MS);
}
function disarmAuto() { clearTimeout(autoTimer); autoTimer = null; }
$('scr-draw').addEventListener('click', () => {
  // 뒤집는 중에 다시 누르면 바로 완료(뒤집기를 시작한 그 탭은 제외)
  if (busy && pending.length) { if (performance.now() - flipStartAt > 180) skipNext(); return; }
  if (!autoTimer || busy || performance.now() - autoArmedAt < TAP_DELAY_MS) return;
  nextStep();
});
function nextStep() {
  disarmAuto();
  if (busy) return;
  $('dBar').innerHTML = ''; $('dBar').dataset.html = '';
  let more;
  try { more = store.nextBatch(); } catch (e) { toast(e.message); updateDraw(); return; }
  if (more) renderDraw(true); else completePurchase();
}

  if (st.current) $('stkSave').disabled = true;
  $('stkSave').onclick = async () => {
    const s = {}; for (const t of TYPES) s[t] = Number($('stk' + t).value);
    if (!TYPES.every((t) => Number.isInteger(s[t]) && s[t] >= 0)) return toast('재고는 0 이상의 정수로 넣어 주세요');
    if (!(await ask(`재고를 A ${s.A} · B ${s.B} · C ${s.C}로 바꿀까요?`, '바꾸기'))) return;
    try { store.setStock(s, $('stkNote').value.trim()); toast('재고를 바꿨어요'); } catch (er) { toast(er.message); }
    paneStock();
  };
}
function fmtTime(iso) { const d = new Date(iso); return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function shownCount(c) { return revealedSoFar(c).length; }
function paneLog() {
  const st = store.state;
  const cur = st.current;
  const items = [...st.log].reverse();
  const purchases = st.log.filter((e) => e.type === 'purchase' && e.status === 'ok');
  $('admPane').innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div style="font-size:44px">정상 ${purchases.length}건 · ${purchases.reduce((n, e) => n + e.qty, 0)}개</div><button class="act" id="csvBtn">CSV 내보내기</button></div>` +
    `<div class="log">${items.length ? items.map((e) => e.type === 'purchase'
      ? `<div class="row"><div class="${e.status === 'cancelled' ? 'cx' : ''}">#${e.no} · ${fmtTime(e.ts)} · ${e.qty}개${e.trimmedFrom ? ` (${e.trimmedFrom}개에서 줄임)` : ''}${cur && cur.id === e.id && !cur.done ? ' · <b style="color:#ffd166">진행 중</b>' : ''}<em class="res">${e.results.join(' ')}</em></div>` +
        (e.status !== 'ok' ? '<span style="font-size:38px;color:#ff9a9a">취소됨</span>'
          : `<div style="display:flex;gap:16px">${cur && cur.id === e.id && !cur.done && shownCount(cur) > 0 ? `<button class="act" data-trim="${e.id}">남은 것만 취소</button>` : ''}<button class="act danger" data-cancel="${e.id}">${cur && cur.id === e.id && !cur.done ? '전체 취소' : '취소'}</button></div>`) + `</div>`
      : `<div class="row"><div>재고 수정 · ${fmtTime(e.ts)}<em>A ${e.before.A}→${e.after.A} · B ${e.before.B}→${e.after.B} · C ${e.before.C}→${e.after.C}${e.note ? ' · ' + e.note : ''}</em></div></div>`).join('') : '<div class="note">아직 기록이 없어요.</div>'}</div>`;
  $('csvBtn').onclick = () => saveFile(`luckybag-log-${stamp()}.csv`, '﻿' + store.toCSV(), 'text/csv');
  $('admPane').querySelectorAll('[data-trim]').forEach((b) => b.onclick = async () => {
    const shown = revealedSoFar(cur);
    if (!(await ask(`#${cur.no} 구매를 공개한 ${shown.length}개(${shown.join(' ')})만 남기고\n아직 안 연 ${cur.qty - shown.length}개는 재고로 돌릴까요?`, '남은 것만 취소'))) return;
    try { store.trimPurchase(cur.id) ? toast(`${shown.length}개만 남겼어요`) : toast('줄일 수 없는 구매예요'); } catch (er) { toast(er.message); }
    paneLog();
  });
  $('admPane').querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => {
    const e = st.log.find((x) => x.id === b.dataset.cancel);
    const live = cur && cur.id === e.id && !cur.done;
    const shown = live ? revealedSoFar(cur) : [];
    const warn = shown.length ? `\n⚠ 이미 공개한 ${shown.length}개(${shown.join(' ')})도 재고로 돌아가요.\n이미 나눠 줬다면 [남은 것만 취소]를 쓰세요.` : '\n재고가 다시 늘어나요.';
    if (!(await ask(`#${e.no} 구매(${e.qty}개: ${e.results.join(' ')})를 모두 취소할까요?${warn}`, '구매 취소'))) return;
    try { store.cancelPurchase(e.id) ? toast('취소했어요') : toast('이미 취소된 구매예요'); } catch (er) { toast(er.message); }
    paneLog();
  });
}
function paneBackup() {
  $('admPane').innerHTML =
    `<div class="row"><div>백업 내보내기<em>설정·재고·기록 전체를 파일 1개로</em></div><button class="act" id="bkOut">내보내기</button></div>` +
    `<div class="row"><div>백업 가져오기<em>현재 데이터를 모두 덮어써요</em></div><label class="act line">파일 선택<input type="file" id="bkIn" accept=".json,application/json" hidden></label></div>` +
    `<div class="row"><div>전체 초기화<em>재고를 A·B·C 각 100으로, 기록을 모두 지움</em></div><button class="act danger" id="bkReset">초기화</button></div>` +
    // 화면 크기: iPad Pro 12.9형이면 2048×2732로 나와야 한다(1024×1366이면 화면 폭 고정이 안 먹은 것 → 메모리 4배)
    `<div class="ver">앱 버전 <b>${APP_VER}</b> · 화면 ${innerWidth}×${innerHeight} · 배율 ${devicePixelRatio}</div>` +
    // 진단 기록: 왼쪽 숫자는 앱을 켠 뒤 지난 시간(초). '멈춤'이 어느 줄 사이에 있는지로 끊기는 곳을 찾는다
    `<div class="note" style="margin-top:40px">진단 기록(최근 ${diag.length}줄) — 끊김이 보인 직후 이 화면을 캡처해 보내 주세요</div>` +
    `<div id="diagBox" style="font-family:ui-monospace,Menlo,monospace;font-size:30px;line-height:1.45;color:#e6dcff;white-space:pre-wrap">${diag.map(([t, l]) => `${(t / 1000).toFixed(2).padStart(7)}s  ${l}`).join('\n')}</div>`;
  $('bkOut').onclick = () => saveFile(`luckybag-backup-${stamp()}.json`, store.exportBackup(), 'application/json');
  $('bkIn').onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const text = await f.text();
    if (!(await ask('이 백업으로 현재 데이터를 모두 덮어쓸까요?', '덮어쓰기'))) return;
    try { store.importBackup(text); toast('백업을 가져왔어요'); } catch (er) { toast(er.message); }
    paneBackup();
  };
  $('bkReset').onclick = async () => {
    if (!(await ask('재고와 판매 기록을 모두 지우고 처음으로 돌릴까요?', '다음'))) return;
    if (!(await ask('정말 지울까요? 되돌릴 수 없어요.\n먼저 백업을 내보내는 걸 권해요.', '모두 지우기'))) return;
    try { store.resetAll({ A: 100, B: 100, C: 100 }); toast('초기화했어요'); } catch (er) { toast(er.message); }
    paneBackup();
  };
}
function stamp() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
async function saveFile(name, text, mime) {
  const file = new File([text], name, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 화면 꺼짐 방지 ── */
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
document.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ── 시작: 진행 중 구매가 있으면 이어서 ── */
try { if (store.state.current) renderDraw(false); else showIdle(); }
catch (e) { console.error(e); busy = false; showIdle(); toast('진행 중 구매를 다시 그리지 못했어요. 관리자 → 기록을 확인해 주세요.'); }
if (storageBlocked) ask('이 iPad에서 저장소를 쓸 수 없어요.\n설정 → Safari → 모든 쿠키 차단을 끄고 앱을 다시 열어 주세요.\n지금 상태로는 판매 기록이 남지 않아요.', '확인', '');
else if (store.loadError) ask(`${store.loadError}\n재고가 처음 값(각 100)으로 보여요.\n관리자 → 백업 가져오기로 되살리거나 재고를 맞춰 주세요.`, '확인', '');

/* ── 오프라인 캐시 ── */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // 새 버전으로 바뀔 때만 새로 고침한다. 처음 설치(이전 컨트롤러 없음) 때는 그대로 둔다.
  let refreshing = false;
  const hadController = !!navigator.serviceWorker.controller;
  let pendingReload = false;
  const reloadNow = () => { if (refreshing) return; refreshing = true; location.reload(); };
  // 새 버전이 받아지면 새로 고침. 구매 진행 중이면 미뤘다가 대기 화면으로 돌아왔을 때 한다(예전 화면이 계속 남지 않게)
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || refreshing) return; if (busy || store.state.current) { pendingReload = true; return; } reloadNow(); });
  setInterval(() => { if (pendingReload && !busy && !store.state.current && $('scr-idle').classList.contains('on')) reloadNow(); }, 1500);
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
window.__app = { store, APP_VER, diag, get busy() { return busy; }, get guardUntil() { return guardUntil; }, get transitioning() { return screenTransition.busy; } }; /* 테스트·점검용 */
</script>
