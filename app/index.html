<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SWC Lucky Bag">
<meta name="theme-color" content="#160A33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>SWC Lucky Bag</title>
<style>
  @font-face{font-family:Unb;src:url(assets/fonts/Unbounded-Variable.ttf) format("truetype");font-weight:200 900;font-display:block}
  @font-face{font-family:Pre;src:url(assets/fonts/Pretendard-Bold.otf);font-weight:700;font-display:block}
  :root{--A:#ff4fa3;--B:#a46bff;--C:#ffc443;--ink:#4b0fb8}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#0d0620;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #stage{position:absolute;left:0;top:0;width:2048px;height:2732px;transform-origin:0 0;overflow:hidden;font-family:Pre,system-ui,sans-serif;color:#fff}
  /* 배경 */
  .bgbase{position:absolute;inset:0;background:radial-gradient(1400px 1100px at 62% 62%,#9b45ff 0%,#7a1fef 38%,transparent 70%),linear-gradient(200deg,#3a0089 0%,#5b0fc7 30%,#7a17ea 60%,#6a0fe0 100%)}
  .streaks{position:absolute;inset:0;background:url(assets/lb/bg-streaks.jpg) center 62%/cover no-repeat;opacity:.4}
  .panel{position:absolute;inset:0;background:linear-gradient(135deg,#e9e3fb 0%,#f6f5f9 55%,#fafafa 100%);clip-path:polygon(0 0,975px 0,0 975px)}
  .panel2{position:absolute;inset:0;background:linear-gradient(160deg,#e6d6fb,#d9c3fa);clip-path:polygon(0 485px,245px 730px,0 975px)}
  .emblem{position:absolute;left:44px;top:44px;width:600px}
  .store{position:absolute;right:72px;top:78px;height:96px}
  .title{position:absolute;right:72px;top:640px;font-family:Unb;font-weight:850;font-size:150px;text-align:right;line-height:.94;letter-spacing:-.01em;text-shadow:0 6px 30px #3a008955}
  #stage.notitle .title{display:none}
  #tapzone{position:absolute;right:0;top:0;width:300px;height:260px;z-index:50}
  /* 화면 */
  .scr{position:absolute;inset:0;display:none}
  .scr.on{display:block}
  /* 카드 */
  .slot{position:absolute;width:560px;height:840px;perspective:2400px;--cw:560px;--acc:#c9a2ff}
  .s-l{left:164px;top:1420px}.s-m{left:744px;top:1320px}.s-r{left:1324px;top:1420px}
  .s-solo{left:634px;top:1100px;width:780px;height:1170px;--cw:780px}
  .ring{position:absolute;left:50%;bottom:-70px;width:120%;height:120px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,#ffffff55,#c9a2ff33 55%,transparent 72%)}
  .card{position:absolute;inset:0;transform-style:preserve-3d}
  .face{position:absolute;inset:0;border-radius:6%}
  .face img.frameimg{position:absolute;inset:0;width:100%;height:100%}
  .back{filter:drop-shadow(0 0 36px #a46bff)}
  .back .emb{position:absolute;left:50%;top:44%;width:38%;transform:translate(-50%,-50%)}
  .back .lb{position:absolute;left:0;right:0;top:56%;text-align:center;font-family:Unb;font-weight:800;font-size:calc(var(--cw)*.062);letter-spacing:.14em;text-shadow:0 0 16px #c9a2ff}
  .front{transform:rotateY(180deg);visibility:hidden;filter:drop-shadow(0 0 40px var(--acc))}
  .front .win{position:absolute;left:11%;right:11%;top:16%;height:57%;clip-path:polygon(0 4%,40% 0,50% -10%,60% 0,100% 4%,100% 62%,50% 100%,0 62%);display:flex;align-items:center;justify-content:center}
  .front .win img{width:112%;height:auto;max-height:118%;object-fit:contain}
  .front .letter{position:absolute;left:4.2%;top:4%;width:15.5%;height:12%;display:grid;place-items:center;font-family:Unb;font-weight:900;font-size:calc(var(--cw)*.105);text-shadow:0 0 18px var(--acc),0 2px 4px #0008}
  .front .name{position:absolute;left:0;right:0;top:79.5%;text-align:center;font-family:Unb;font-weight:850;font-size:calc(var(--cw)*.075);letter-spacing:.03em;text-shadow:0 3px 12px #0009}
  .flipped .card{transform:rotateY(180deg)}
  .flipped .front{visibility:visible}
  .flipped .back{visibility:hidden}
  .slot.tappable{cursor:pointer}
  .slot.tappable .back{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{filter:drop-shadow(0 0 60px #d7b8ff)}}
  .hint{position:absolute;left:0;right:0;top:2350px;text-align:center;font-family:Unb;font-weight:700;font-size:64px;letter-spacing:.06em;text-shadow:0 0 20px #c9a2ff}
  .hint.blink{animation:blink 1.8s ease-in-out infinite}
  @keyframes blink{50%{opacity:.35}}
  .progress{position:absolute;left:0;right:0;bottom:120px;text-align:center}
  .progress .sum{font-family:Unb;font-weight:700;font-size:56px}
  .progress .sub{font-family:Unb;font-size:36px;opacity:.75;margin-top:14px;letter-spacing:.08em}
  .staffbar{position:absolute;left:120px;right:120px;bottom:330px;display:flex;gap:40px;justify-content:center}
  .btn{font-family:Pre;font-size:58px;color:#fff;border-radius:28px;padding:34px 70px;background:#ffffff1f;border:4px solid #ffffff66}
  .btn.pri{background:#fff;color:var(--ink);border-color:#fff}
  .btn:disabled,.startbtn:disabled{opacity:.35}
  button{font:inherit;cursor:pointer}
  /* 직원·관리자 판 */
  .sheet{position:absolute;left:110px;right:110px;top:1080px;bottom:140px;border-radius:60px;background:#160a33f2;border:3px solid #ffffff2e;padding:80px 90px}
  .sheet h4{font-size:70px;margin:0 0 30px}
  .qty{display:flex;align-items:center;justify-content:center;gap:60px;margin:10px 0 40px}
  .qty .n{font-family:Unb;font-weight:800;font-size:260px;min-width:420px;text-align:center}
  .qty button{width:180px;height:180px;border-radius:50%;border:5px solid #fff8;background:none;color:#fff;font-size:110px;line-height:1}
  .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:28px;margin-bottom:50px}
  .keys button{height:150px;border-radius:30px;background:#ffffff14;border:0;color:#fff;font-family:Unb;font-size:66px}
  .keys button.on{background:#fff;color:var(--ink)}
  .stock{display:flex;gap:30px;margin-bottom:34px}
  .stock div{flex:1;border-radius:30px;padding:26px;background:#ffffff10;border:3px solid var(--acc);text-align:center;font-size:44px}
  .stock b{display:block;font-family:Unb;font-size:110px}
  .chips{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:30px}
  .chips span{font-size:38px;padding:14px 30px;border-radius:99px;background:#ffffff18}
  .warn{min-height:60px;font-size:46px;color:#ffd166;text-align:center;margin-bottom:20px}
  .startrow{display:flex;gap:30px}
  .startbtn{flex:1;border-radius:40px;background:#fff;color:var(--ink);text-align:center;font-size:84px;padding:50px;border:0;font-family:Pre}
  .ghost{border-radius:40px;background:none;border:4px solid #ffffff66;color:#fff;font-size:60px;padding:40px 60px}
  .summary{position:absolute;left:0;right:0;top:1320px;display:flex;justify-content:center;gap:70px}
  .summary .it{width:520px;text-align:center}
  .summary .it.zero{opacity:.3}
  .summary .mini{width:420px;height:630px;margin:0 auto 40px;position:relative}
  .summary .cnt{font-family:Unb;font-weight:900;font-size:150px}
  .summary .lab{font-family:Unb;font-size:46px;opacity:.85}
  /* 관리자 */
  #scr-admin .sheet{top:330px;bottom:120px;display:flex;flex-direction:column;overflow:hidden}
  .pin{display:flex;flex-direction:column;align-items:center;gap:50px;margin-top:120px}
  .pin .dots{font-size:110px;letter-spacing:40px;height:140px}
  .pin .grid{display:grid;grid-template-columns:repeat(3,240px);gap:36px}
  .pin .grid button{height:200px;border-radius:40px;border:0;background:#ffffff1a;color:#fff;font-family:Unb;font-size:80px}
  .tabs{display:flex;gap:20px;margin-bottom:40px;flex-wrap:wrap}
  .tabs button{font-size:46px;padding:20px 48px;border-radius:99px;background:#ffffff14;border:0;color:#fff}
  .tabs button.on{background:#fff;color:var(--ink)}
  .tabs .close{margin-left:auto;background:none;border:3px solid #ffffff66}
  .pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:30px;padding:36px 0;border-bottom:2px solid #ffffff1c;font-size:50px}
  .row em{font-style:normal;color:#c9b8f0;font-size:36px;display:block;margin-top:8px}
  .sw{display:flex;border-radius:99px;background:#ffffff14;padding:8px;flex:0 0 auto}
  .sw button{padding:18px 40px;border-radius:99px;font-size:42px;background:none;border:0;color:#fff}
  .sw button.on{background:#fff;color:var(--ink)}
  .act{padding:20px 44px;border-radius:24px;font-size:42px;background:#fff;color:var(--ink);border:0;flex:0 0 auto}
  .act.danger{background:#ff5a5a;color:#fff}
  .act.line{background:none;color:#fff;border:3px solid #ffffff66}
  .inp{font-family:Unb;font-size:56px;width:260px;padding:16px 24px;border-radius:20px;border:3px solid #ffffff44;background:#ffffff10;color:#fff;text-align:center}
  .inp.wide{width:100%;font-family:Pre;font-size:44px;text-align:left}
  .log{font-size:40px}
  .log .row{font-size:40px}
  .log .res{font-family:Unb;letter-spacing:.06em}
  .log .cx{opacity:.4;text-decoration:line-through}
  .note{font-size:36px;color:#c9b8f0;line-height:1.5;margin:20px 0}
  .ver{font-size:34px;color:#c9b8f0;text-align:center;margin-top:40px}
  /* 확인 창·알림 */
  #modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:80}
  #modal.on{display:flex}
  #modal .box{width:1400px;border-radius:50px;background:#1d0e42;border:3px solid #ffffff33;padding:80px;text-align:center}
  #modal p{font-size:58px;line-height:1.45;margin:0 0 60px;white-space:pre-line}
  #modal .btns{display:flex;gap:40px;justify-content:center}
  #toast{position:absolute;left:50%;top:180px;transform:translateX(-50%);background:#000c;border-radius:30px;padding:30px 60px;font-size:48px;z-index:90;display:none;max-width:1700px;text-align:center}
  #toast.on{display:block}
</style>
</head>
<body>
<div id="stage">
  <div class="bgbase"></div><div class="streaks"></div><div class="panel"></div><div class="panel2"></div>
  <img class="emblem" src="assets/lb/emblem-key.png" alt="">
  <img class="store" src="assets/com2us-store-lockup-white.svg" alt="">
  <div class="title">COM2US STORE<br>LUCKY BAG DRAW</div>

  <!-- 대기 -->
  <section class="scr" id="scr-idle">
    <div id="idleCards"></div>
    <div class="hint blink">TOUCH TO START</div>
  </section>

  <!-- 직원: 수량 입력 -->
  <section class="scr" id="scr-staff">
    <div class="sheet">
      <h4>구매 수량 입력</h4>
      <div class="qty"><button id="qMinus" aria-label="하나 빼기">−</button><div class="n" id="qN">1</div><button id="qPlus" aria-label="하나 더하기">+</button></div>
      <div class="keys" id="qKeys"></div>
      <div class="stock" id="stockBox"></div>
      <div class="chips" id="chips"></div>
      <div class="warn" id="qWarn"></div>
      <div class="startrow"><button class="ghost" id="qCancel">취소</button><button class="startbtn" id="qStart">뽑기 시작</button></div>
    </div>
  </section>

  <!-- 뽑기 -->
  <section class="scr" id="scr-draw">
    <div id="slots"></div>
    <div class="hint" id="dHint"></div>
    <div class="staffbar" id="dBar"></div>
    <div class="progress"><div class="sum" id="dSum"></div><div class="sub" id="dSub"></div></div>
  </section>

  <!-- 구매 요약 -->
  <section class="scr" id="scr-summary">
    <div class="summary" id="sumCards"></div>
    <div class="staffbar"><button class="btn pri" id="sNext">다음 고객</button></div>
    <div class="progress"><div class="sum" id="sTotal"></div><div class="sub">THANK YOU!</div></div>
  </section>

  <!-- 관리자 -->
  <section class="scr" id="scr-admin">
    <div class="sheet">
      <div id="pinView" class="pin">
        <div style="font-size:60px">관리자 PIN</div>
        <div class="dots" id="pinDots"></div>
        <div class="grid" id="pinGrid"></div>
        <button class="act line" id="pinBack">돌아가기</button>
      </div>
      <div id="admView" style="display:none;flex:1;flex-direction:column;min-height:0">
        <div class="tabs" id="admTabs">
          <button data-t="set" class="on">설정</button><button data-t="stock">재고</button><button data-t="log">기록</button><button data-t="backup">백업</button>
          <button class="close" id="admClose">닫기</button>
        </div>
        <div class="pane" id="admPane"></div>
      </div>
    </div>
  </section>

  <div id="tapzone"></div>
  <div id="modal"><div class="box"><p id="mText"></p><div class="btns"><button class="act line" id="mNo">아니요</button><button class="act" id="mYes">예</button></div></div></div>
  <div id="toast"></div>
</div>

<script src="bag-engine.js"></script>
<script src="bag-store.js"></script>
<script src="reveal.js"></script>
<script>
'use strict';
const APP_VER = 'swc-lb-v1'; /* sw.js CACHE와 함께 올림 */
const $ = (id) => document.getElementById(id);
const stage = $('stage');
// 저장소 접근이 막힌 설정(사이트 데이터 차단 등)이어도 앱은 뜨게 하고 직원에게 알린다.
let storageBlocked = false;
const storage = (() => {
  try { const s = window.localStorage; s.getItem('probe'); return s; }
  catch (e) { storageBlocked = true; const m = new Map(); return { getItem: (k) => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: (k) => m.delete(k) }; }
})();
const store = BagStore.createStore(storage);
const TYPES = BagEngine.TYPES;
let busy = false;

/* 화면이 바뀐 직후 같은 자리를 한 번 더 누른 탭이 새 화면 버튼을 누르지 않게 잠깐 무시한다. */
let guardUntil = 0;
function guard(ms = 450) { guardUntil = performance.now() + ms; }
stage.addEventListener('click', (e) => { if (performance.now() < guardUntil) { e.stopPropagation(); e.preventDefault(); } }, true);

/* 연출은 언제 바뀔지 모르는 부분이라, 오류를 내거나 끝나지 않아도 정해진 시간 안에 앱이 다시 움직이게 한다. */
function runAnim(fn, maxMs) {
  return Promise.race([Promise.resolve().then(fn).catch((e) => console.error('연출 오류', e)), new Promise((r) => setTimeout(r, maxMs))]);
}
function ensureShown(slot, type) {
  if (slot.classList.contains('flipped')) return;
  try { Reveal.show(slot, type); } catch (e) { slot.classList.add('flipped'); }
}

/* ── 무대 맞춤 ── */
function fit() {
  const s = Math.min(innerWidth / 2048, innerHeight / 2732);
  stage.style.transform = `translate(${(innerWidth - 2048 * s) / 2}px,${(innerHeight - 2732 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

/* ── 공통 ── */
function go(id) {
  guard();
  document.querySelectorAll('.scr').forEach((s) => s.classList.toggle('on', s.id === id));
  stage.classList.toggle('notitle', id === 'scr-admin');
}
let toastT;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600); }
function ask(text, yesLabel = '예', noLabel = '아니요') {
  return new Promise((res) => {
    guard();
    $('mText').textContent = text; $('mYes').textContent = yesLabel;
    $('mNo').textContent = noLabel || ''; $('mNo').style.display = noLabel ? '' : 'none';
    $('modal').classList.add('on');
    const done = (v) => { $('modal').classList.remove('on'); $('mYes').onclick = $('mNo').onclick = null; res(v); };
    $('mYes').onclick = () => done(true); $('mNo').onclick = () => done(false);
  });
}
function counts(list) { const c = { A: 0, B: 0, C: 0 }; list.forEach((t) => c[t]++); return c; }
const sumText = (c) => `A ${c.A} · B ${c.B} · C ${c.C}`;
function slotHTML(cls) {
  return `<div class="slot ${cls}"><div class="ring"></div><div class="card">` +
    `<div class="face back"><img class="frameimg" src="assets/lb/card-back.png" alt=""><img class="emb" src="assets/lb/emblem-x-white.png" alt=""><div class="lb">LUCKY BAG</div></div>` +
    `<div class="face front"></div></div></div>`;
}
const POS = { 1: ['s-m'], 2: ['s-l', 's-r'], 3: ['s-l', 's-m', 's-r'] };

/* ── 대기 ── */
function showIdle() {
  $('idleCards').innerHTML = POS[3].map(slotHTML).join('');
  go('scr-idle');
}
$('scr-idle').addEventListener('click', () => { if (!busy) showStaff(); });

/* ── 관리자 진입: 오른쪽 위 3초 안에 5번 ── */
let taps = [];
$('tapzone').addEventListener('click', (e) => {
  e.stopPropagation();
  const t = Date.now(); taps = taps.filter((x) => t - x < 3000); taps.push(t);
  if (taps.length >= 5) { taps = []; openPin(); }
});

/* ── 직원 화면 ── */
let qty = 1;
(function buildKeys() {
  $('qKeys').innerHTML = Array.from({ length: 10 }, (_, i) => `<button data-n="${i + 1}">${i + 1}</button>`).join('');
  $('qKeys').addEventListener('click', (e) => { const n = e.target.dataset.n; if (n) { qty = +n; renderStaff(); } });
})();
$('qMinus').onclick = () => { qty = Math.max(1, qty - 1); renderStaff(); };
$('qPlus').onclick = () => { qty = Math.min(300, qty + 1); renderStaff(); };
$('qCancel').onclick = () => showIdle();
function chipsHTML(cfg) {
  const batches = BagEngine.splitBatches(qty, cfg.unit);
  return [cfg.unit === 'single' ? '한 개씩 추첨' : '한꺼번에 · 최대 3장',
    cfg.unit === 'single' ? '' : (cfg.reveal === 'all' ? '동시에 공개' : '한 장씩 공개'),
    `중복 줄이기 ${cfg.dupReduce ? 'ON' : 'OFF'}`,
    cfg.unit === 'single' ? `${qty}번 뽑기` : `${batches.length}묶음 (${batches.join('·')})`]
    .filter(Boolean).map((s) => `<span>${s}</span>`).join('');
}
function renderStaff() {
  const st = store.state;
  $('qN').textContent = qty;
  [...$('qKeys').children].forEach((b) => b.classList.toggle('on', +b.dataset.n === qty));
  $('stockBox').innerHTML = TYPES.map((t) => `<div style="--acc:var(--${t})">${t} 남음<b>${st.stock[t]}</b></div>`).join('');
  $('chips').innerHTML = chipsHTML(st.config);
  const chk = BagEngine.canStart(st.stock, qty);
  $('qWarn').textContent = chk.ok ? '' : (chk.left === 0 ? '럭키백이 모두 소진됐어요' : `남은 럭키백 ${chk.left}개 — 수량을 줄여 주세요`);
  $('qStart').disabled = !chk.ok;
}
function showStaff() { qty = 1; renderStaff(); go('scr-staff'); }
$('qStart').onclick = () => {
  if (busy || $('qStart').disabled) return;
  $('qStart').disabled = true;
  try { store.startPurchase(qty); } catch (e) { toast(e.message); renderStaff(); return; }
  renderDraw(true);
};

/* ── 뽑기 ── */
function batchInfo(c) {
  const start = c.batches.slice(0, c.batchIndex).reduce((a, b) => a + b, 0);
  const n = c.batches[c.batchIndex];
  return { start, n, types: c.results.slice(start, start + n) };
}
function renderDraw(fresh) {
  const c = store.state.current;
  if (!c) return showIdle();
  if (c.done) return showSummary();
  const { n, types } = batchInfo(c);
  const solo = c.settings.unit === 'single';
  const cls = solo ? ['s-solo'] : POS[n];
  $('slots').innerHTML = cls.map(slotHTML).join('');
  const slots = [...$('slots').children];
  slots.forEach((s, i) => {
    if (c.revealed.includes(i)) Reveal.show(s, types[i]);
    s.addEventListener('click', () => tapCard(i));
  });
  $('dBar').innerHTML = '';
  go('scr-draw');
  updateDraw();
  if (fresh || c.revealed.length === 0) {
    busy = true; updateDraw();
    runAnim(() => Reveal.enter(slots), 3000).then(() => { busy = false; updateDraw(); });
  }
}
function revealedSoFar(c) {
  const { start, types } = batchInfo(c);
  return [...c.results.slice(0, start), ...c.revealed.map((i) => types[i])];
}
function updateDraw() {
  const c = store.state.current; if (!c) return;
  const { n } = batchInfo(c);
  const solo = c.settings.unit === 'single';
  const allMode = !solo && c.settings.reveal === 'all';
  const doneBatch = c.revealed.length >= n;
  const slots = [...$('slots').children];
  slots.forEach((s, i) => s.classList.toggle('tappable', !busy && !allMode && !c.revealed.includes(i)));
  const shown = revealedSoFar(c);
  $('dSum').textContent = sumText(counts(shown));
  $('dSub').textContent = solo ? `${shown.length} / ${c.qty}` : `BATCH ${c.batchIndex + 1} / ${c.batches.length} · ${shown.length} OF ${c.qty}`;
  const last = c.batchIndex === c.batches.length - 1;
  let bar = '';
  if (!doneBatch) {
    $('dHint').textContent = busy ? '' : allMode ? 'READY?' : solo ? 'TAP THE CARD' : n > 1 ? 'TAP A CARD TO REVEAL' : 'TAP THE CARD';
    if (allMode && !busy) bar = `<button class="btn pri" id="dOpen">OPEN ▶</button>`;
  } else {
    $('dHint').textContent = '';
    if (!busy) bar = last ? `<button class="btn pri" id="dNext">지급 완료</button>` : `<button class="btn pri" id="dNext">${solo ? '다음 뽑기 ▶' : '다음 묶음 ▶'}</button>`;
  }
  $('dHint').classList.toggle('blink', !!$('dHint').textContent);
  if ($('dBar').dataset.html !== bar) {
    $('dBar').innerHTML = bar; $('dBar').dataset.html = bar;
    if ($('dOpen')) $('dOpen').onclick = openAll;
    if ($('dNext')) $('dNext').onclick = nextStep;
  }
}
function tapCard(i) {
  const c = store.state.current;
  if (busy || !c || c.revealed.includes(i)) return;
  if (c.settings.unit !== 'single' && c.settings.reveal === 'all') return;
  const { types } = batchInfo(c);
  busy = true;
  try { store.markRevealed(i); } catch (e) { busy = false; toast(e.message); return; }
  updateDraw();
  const slot = $('slots').children[i];
  runAnim(() => Reveal.flip(slot, types[i]), 4000).then(() => { ensureShown(slot, types[i]); busy = false; updateDraw(); });
}
function openAll() {
  const c = store.state.current;
  if (busy || !c) return;
  const { types } = batchInfo(c);
  const todo = types.map((_, i) => i).filter((i) => !c.revealed.includes(i));
  busy = true;
  try { todo.forEach((i) => store.markRevealed(i)); } catch (e) { busy = false; toast(e.message); return; }
  updateDraw();
  const slots = $('slots').children;
  runAnim(() => Promise.all(todo.map((i) => Reveal.flip(slots[i], types[i]))), 4000)
    .then(() => { todo.forEach((i) => ensureShown(slots[i], types[i])); busy = false; updateDraw(); });
}
function nextStep() {
  if (busy) return;
  $('dBar').innerHTML = ''; $('dBar').dataset.html = '';
  let more;
  try { more = store.nextBatch(); } catch (e) { toast(e.message); updateDraw(); return; }
  if (more) renderDraw(true); else showSummary();
}

/* ── 구매 요약 ── */
function showSummary() {
  const c = store.state.current;
  if (!c) return showIdle();
  const cnt = counts(c.results);
  $('sumCards').innerHTML = TYPES.map((t) => `<div class="it ${cnt[t] ? '' : 'zero'}"><div class="mini">${slotHTML('').replace('class="slot "', 'class="slot" style="left:0;top:0;width:420px;height:630px;--cw:420px"')}</div><div class="cnt">×${cnt[t]}</div><div class="lab">LUCKY BAG ${t}</div></div>`).join('');
  [...$('sumCards').querySelectorAll('.slot')].forEach((s, i) => Reveal.show(s, TYPES[i]));
  $('sTotal').textContent = `TOTAL ${c.qty}`;
  go('scr-summary');
}
$('sNext').onclick = () => { try { store.finishPurchase(); } catch (e) { toast(e.message); return; } showIdle(); };

/* ── 관리자 ── */
let pinBuf = '';
(function buildPin() {
  $('pinGrid').innerHTML = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✓'].map((k) => `<button data-k="${k}">${k}</button>`).join('');
  $('pinGrid').addEventListener('click', (e) => {
    const k = e.target.dataset.k; if (!k) return;
    if (k === '⌫') pinBuf = pinBuf.slice(0, -1);
    else if (k === '✓') return checkPin();
    else if (pinBuf.length < 8) pinBuf += k;
    renderPin();
    if (pinBuf.length === String(store.state.config.pin).length) checkPin();
  });
})();
function renderPin() { const L = Math.max(4, String(store.state.config.pin).length); $('pinDots').textContent = '●'.repeat(pinBuf.length) + '○'.repeat(Math.max(0, L - pinBuf.length)); }
function openPin() { pinBuf = ''; renderPin(); $('pinView').style.display = 'flex'; $('admView').style.display = 'none'; go('scr-admin'); }
function checkPin() {
  if (pinBuf === String(store.state.config.pin)) { $('pinView').style.display = 'none'; $('admView').style.display = 'flex'; admTab('set'); }
  else { toast('PIN이 맞지 않아요'); pinBuf = ''; renderPin(); }
}
function closeAdmin() { if (store.state.current) renderDraw(false); else showIdle(); }
$('pinBack').onclick = closeAdmin;
$('admClose').onclick = closeAdmin;
$('admTabs').addEventListener('click', (e) => { const t = e.target.dataset.t; if (t) admTab(t); });
let curTab = 'set';
function admTab(t) {
  curTab = t;
  [...$('admTabs').querySelectorAll('[data-t]')].forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  ({ set: paneSet, stock: paneStock, log: paneLog, backup: paneBackup })[t]();
}
function sw(key, opts, val) { return `<div class="sw" data-key="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(v) === String(val) ? 'on' : ''}">${l}</button>`).join('')}</div>`; }
function paneSet() {
  const c = store.state.config;
  $('admPane').innerHTML =
    `<div class="row"><div>추첨 단위<em>한 번에 몇 장을 뽑을지</em></div>${sw('unit', [['single', '한 개씩'], ['batch', '한꺼번에']], c.unit)}</div>` +
    `<div class="row"><div>공개 방식<em>한꺼번에 추첨일 때만 적용</em></div>${sw('reveal', [['one', '한 장씩'], ['all', '동시에']], c.reveal)}</div>` +
    `<div class="row"><div>중복 줄이기<em>한 구매 안에서 같은 유형 줄이기</em></div>${sw('dupReduce', [[false, '끄기'], [true, '켜기']], c.dupReduce)}</div>` +
    `<div class="row"><div>PIN 변경<em>숫자 4~8자리</em></div><div style="display:flex;gap:20px"><input class="inp" id="pinNew" inputmode="numeric" maxlength="8" placeholder="새 PIN"><button class="act" id="pinSave">변경</button></div></div>` +
    `<div class="note">설정은 다음 구매부터 적용돼요. 진행 중인 구매는 시작할 때 설정 그대로 끝까지 가요.</div>`;
  $('admPane').querySelectorAll('.sw').forEach((el) => el.addEventListener('click', (e) => {
    const v = e.target.dataset.v; if (v === undefined) return;
    const key = el.dataset.key; const val = key === 'dupReduce' ? v === 'true' : v;
    try { store.setConfig({ [key]: val }); toast('저장했어요'); } catch (er) { toast(er.message); }
    paneSet();
  }));
  $('pinSave').onclick = () => {
    const p = $('pinNew').value.trim();
    if (!/^\d{4,8}$/.test(p)) return toast('PIN은 숫자 4~8자리로 넣어 주세요');
    try { store.setConfig({ pin: p }); toast('PIN을 바꿨어요'); } catch (er) { toast(er.message); }
    paneSet();
  };
}
function soldCounts(st) {
  const c = { A: 0, B: 0, C: 0 };
  st.log.forEach((e) => { if (e.type === 'purchase' && e.status === 'ok') e.results.forEach((t) => c[t]++); });
  return c;
}
function paneStock() {
  const st = store.state, sold = soldCounts(st);
  $('admPane').innerHTML =
    TYPES.map((t) => `<div class="row"><div>${t} 남은 재고<em>판매 ${sold[t]}개</em></div><input class="inp" id="stk${t}" type="number" inputmode="numeric" min="0" value="${st.stock[t]}"></div>`).join('') +
    `<div class="row" style="flex-direction:column;align-items:stretch"><div>고친 이유</div><input class="inp wide" id="stkNote" placeholder="예: 실물 재고 확인"></div>` +
    `<div style="display:flex;justify-content:flex-end;margin-top:40px"><button class="act" id="stkSave">재고 저장</button></div>` +
    `<div class="note">남은 합계 ${BagEngine.total(st.stock)}개 · 정상 판매 ${sold.A + sold.B + sold.C}개. 재고를 고치면 기록에 고치기 전·후가 남아요.</div>` +
    (st.current ? `<div class="note" style="color:#ffd166">진행 중인 구매 #${st.current.no}가 있어요. 이 구매의 결과 ${st.current.qty}개는 이미 재고에서 빠져 있어서, 지금 실물과 맞추면 어긋나요. 구매를 끝낸 뒤 고쳐 주세요.</div>` : '');
  if (st.current) $('stkSave').disabled = true;
  $('stkSave').onclick = async () => {
    const s = {}; for (const t of TYPES) s[t] = Number($('stk' + t).value);
    if (!TYPES.every((t) => Number.isInteger(s[t]) && s[t] >= 0)) return toast('재고는 0 이상의 정수로 넣어 주세요');
    if (!(await ask(`재고를 A ${s.A} · B ${s.B} · C ${s.C}로 바꿀까요?`, '바꾸기'))) return;
    try { store.setStock(s, $('stkNote').value.trim()); toast('재고를 바꿨어요'); } catch (er) { toast(er.message); }
    paneStock();
  };
}
function fmtTime(iso) { const d = new Date(iso); return d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }); }
function shownCount(c) { return revealedSoFar(c).length; }
function paneLog() {
  const st = store.state;
  const cur = st.current;
  const items = [...st.log].reverse();
  const purchases = st.log.filter((e) => e.type === 'purchase' && e.status === 'ok');
  $('admPane').innerHTML =
    `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px"><div style="font-size:44px">정상 ${purchases.length}건 · ${purchases.reduce((n, e) => n + e.qty, 0)}개</div><button class="act" id="csvBtn">CSV 내보내기</button></div>` +
    `<div class="log">${items.length ? items.map((e) => e.type === 'purchase'
      ? `<div class="row"><div class="${e.status === 'cancelled' ? 'cx' : ''}">#${e.no} · ${fmtTime(e.ts)} · ${e.qty}개${e.trimmedFrom ? ` (${e.trimmedFrom}개에서 줄임)` : ''}${cur && cur.id === e.id && !cur.done ? ' · <b style="color:#ffd166">진행 중</b>' : ''}<em class="res">${e.results.join(' ')}</em></div>` +
        (e.status !== 'ok' ? '<span style="font-size:38px;color:#ff9a9a">취소됨</span>'
          : `<div style="display:flex;gap:16px">${cur && cur.id === e.id && !cur.done && shownCount(cur) > 0 ? `<button class="act" data-trim="${e.id}">남은 것만 취소</button>` : ''}<button class="act danger" data-cancel="${e.id}">${cur && cur.id === e.id && !cur.done ? '전체 취소' : '취소'}</button></div>`) + `</div>`
      : `<div class="row"><div>재고 수정 · ${fmtTime(e.ts)}<em>A ${e.before.A}→${e.after.A} · B ${e.before.B}→${e.after.B} · C ${e.before.C}→${e.after.C}${e.note ? ' · ' + e.note : ''}</em></div></div>`).join('') : '<div class="note">아직 기록이 없어요.</div>'}</div>`;
  $('csvBtn').onclick = () => saveFile(`luckybag-log-${stamp()}.csv`, '﻿' + store.toCSV(), 'text/csv');
  $('admPane').querySelectorAll('[data-trim]').forEach((b) => b.onclick = async () => {
    const shown = revealedSoFar(cur);
    if (!(await ask(`#${cur.no} 구매를 공개한 ${shown.length}개(${shown.join(' ')})만 남기고\n아직 안 연 ${cur.qty - shown.length}개는 재고로 돌릴까요?`, '남은 것만 취소'))) return;
    try { store.trimPurchase(cur.id) ? toast(`${shown.length}개만 남겼어요`) : toast('줄일 수 없는 구매예요'); } catch (er) { toast(er.message); }
    paneLog();
  });
  $('admPane').querySelectorAll('[data-cancel]').forEach((b) => b.onclick = async () => {
    const e = st.log.find((x) => x.id === b.dataset.cancel);
    const live = cur && cur.id === e.id && !cur.done;
    const shown = live ? revealedSoFar(cur) : [];
    const warn = shown.length ? `\n⚠ 이미 공개한 ${shown.length}개(${shown.join(' ')})도 재고로 돌아가요.\n이미 나눠 줬다면 [남은 것만 취소]를 쓰세요.` : '\n재고가 다시 늘어나요.';
    if (!(await ask(`#${e.no} 구매(${e.qty}개: ${e.results.join(' ')})를 모두 취소할까요?${warn}`, '구매 취소'))) return;
    try { store.cancelPurchase(e.id) ? toast('취소했어요') : toast('이미 취소된 구매예요'); } catch (er) { toast(er.message); }
    paneLog();
  });
}
function paneBackup() {
  $('admPane').innerHTML =
    `<div class="row"><div>백업 내보내기<em>설정·재고·기록 전체를 파일 1개로</em></div><button class="act" id="bkOut">내보내기</button></div>` +
    `<div class="row"><div>백업 가져오기<em>현재 데이터를 모두 덮어써요</em></div><label class="act line">파일 선택<input type="file" id="bkIn" accept=".json,application/json" hidden></label></div>` +
    `<div class="row"><div>전체 초기화<em>재고를 A·B·C 각 100으로, 기록을 모두 지움</em></div><button class="act danger" id="bkReset">초기화</button></div>` +
    `<div class="ver">앱 버전 <b>${APP_VER}</b></div>`;
  $('bkOut').onclick = () => saveFile(`luckybag-backup-${stamp()}.json`, store.exportBackup(), 'application/json');
  $('bkIn').onchange = async (ev) => {
    const f = ev.target.files[0]; if (!f) return;
    const text = await f.text();
    if (!(await ask('이 백업으로 현재 데이터를 모두 덮어쓸까요?', '덮어쓰기'))) return;
    try { store.importBackup(text); toast('백업을 가져왔어요'); } catch (er) { toast(er.message); }
    paneBackup();
  };
  $('bkReset').onclick = async () => {
    if (!(await ask('재고와 판매 기록을 모두 지우고 처음으로 돌릴까요?', '다음'))) return;
    if (!(await ask('정말 지울까요? 되돌릴 수 없어요.\n먼저 백업을 내보내는 걸 권해요.', '모두 지우기'))) return;
    try { store.resetAll({ A: 100, B: 100, C: 100 }); toast('초기화했어요'); } catch (er) { toast(er.message); }
    paneBackup();
  };
}
function stamp() { const d = new Date(), p = (n) => String(n).padStart(2, '0'); return `${d.getFullYear()}${p(d.getMonth() + 1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`; }
async function saveFile(name, text, mime) {
  const file = new File([text], name, { type: mime });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ── 화면 꺼짐 방지 ── */
let wake = null;
async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
document.addEventListener('pointerdown', keepAwake);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ── 시작: 진행 중 구매가 있으면 이어서 ── */
try { if (store.state.current) renderDraw(false); else showIdle(); }
catch (e) { console.error(e); busy = false; showIdle(); toast('진행 중 구매를 다시 그리지 못했어요. 관리자 → 기록을 확인해 주세요.'); }
if (storageBlocked) ask('이 iPad에서 저장소를 쓸 수 없어요.\n설정 → Safari → 모든 쿠키 차단을 끄고 앱을 다시 열어 주세요.\n지금 상태로는 판매 기록이 남지 않아요.', '확인', '');
else if (store.loadError) ask(`${store.loadError}\n재고가 처음 값(각 100)으로 보여요.\n관리자 → 백업 가져오기로 되살리거나 재고를 맞춰 주세요.`, '확인', '');

/* ── 오프라인 캐시 ── */
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // 새 버전으로 바뀔 때만 새로 고침한다. 처음 설치(이전 컨트롤러 없음) 때는 그대로 둔다.
  let refreshing = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!hadController || refreshing || busy) return; refreshing = true; location.reload(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
}
window.__app = { store, APP_VER, get busy() { return busy; }, get guardUntil() { return guardUntil; } }; /* 테스트·점검용 */
</script>
</body>
</html>
